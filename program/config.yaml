general:
  node_prefix: "xBench"
  log_level: "INFO"

paths:
  bin_dir: "bin"
  subscriptions_file: "data/subscriptions.txt"
  custom_nodes_file: "data/custom_nodes.txt"
  blacklist_file: "data/blacklist.txt"
  database_path: "data/nodes_cache.db"
  output_http_file: "../results/nodes_http.txt"
  output_speed_file: "../results/nodes_speed.txt"

xray:
  batch_size: 40
  startup_timeout_sec: 5.0
  listen_host: "127.0.0.1"

geo:
  cache_ttl_days: 14
  blocked_google_countries:
    - "IR"
    - "RU"
  check_google_country: true
  primary_api_url: "https://get.geojs.io/v1/ip/geo/{ip}.json"
  backup_api_urls:
    - "http://ip-api.com/json/{ip}?fields=status,countryCode,isp"
    - "https://ipwhois.app/json/{ip}"
    - "https://ipwho.is/{ip}"
    - "https://ipinfo.io/{ip}/json"
  google_check_url: "https://www.google.com/"
  google_fallback_url: "https://www.google.com/preferences?hl=en"

http_test:
  test_url: "http://cp.cloudflare.com/generate_204"
  timeout_sec: 10.0
  concurrency: 12
  warmup_requests: 0
  timed_requests: 1

speed_test:
  payload_url: "https://speed.cloudflare.com/__down?bytes=2000000"
  timeout_sec: 5.0
  concurrency: 4
  min_speed_mbps: 0.1
  bottom_third_divisor: 3
  max_consecutive_zero_runs: 3

github:
  commit_message_prefix: "Update proxy nodes [automated]"
